<app-auth-layout>
  <div class="auth-form"> 
    <h2>{{ t.translate('auth.login.title') }}</h2>
    <form (submit)="login()">
      <label>
        {{ t.translate('auth.login.username') }}:
        <input type="text" [(ngModel)]="username" name="username" required />
      </label>
      <br />
      <label>
        {{ t.translate('auth.login.password') }}:
        <input type="password" [(ngModel)]="password" name="password" required />
      </label>
      <br />
      <button class="register-btn" type="submit">{{ t.translate('auth.login.button') }}</button>
    </form>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p>
      {{ t.translate('auth.login.noAccount') }}
      <a routerLink="/register">{{ t.translate('auth.login.registerHere') }}</a>
    </p>
  </div>
</app-auth-layout>
