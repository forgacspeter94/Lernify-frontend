<div class="dashboard-cards-grid">

  <!-- ✅ ADD SUBJECT CARD (ALWAYS FIRST) -->
  <div class="dashboard-card add-card" (click)="toggleAddForm()">
    <h3>➕ {{ t.translate('subjects.addNew') }}</h3>
    <p>{{ t.translate('subjects.createNew') }}</p>
  </div>

  <!-- Add subject form -->
  <div class="dashboard-card add-form" *ngIf="showAddForm">
    <form (ngSubmit)="addSubject()">
      <input
        type="text"
        [(ngModel)]="newSubject"
        name="subject"
        [placeholder]="t.translate('subjects.placeholder')"
      />
      <button type="submit">{{ t.translate('button.add') }}</button>
    </form>
  </div>

  <!-- 📚 SUBJECT CARDS -->
  <div class="dashboard-card subject-card" *ngFor="let subject of subjects">
    <button 
      class="delete-btn" 
      (click)="deleteSubject($event, subject.id, subject.name)"
      [title]="t.translate('subjects.deleteTitle')"
    >
      ✕
    </button>
    
    <a [routerLink]="['/subjects', subject.id]" class="card-link">
      <h3>{{ subject.name }}</h3>
      <p>{{ t.translate('subjects.openSubject') }}</p>
    </a>
  </div>

  <!-- Empty state -->
  <p class="empty-state" *ngIf="subjects.length === 0 && !showAddForm">
    {{ t.translate('subjects.noSubjects') }}
  </p>

</div>
